apiVersion: project.tcs.trifork.com/v1alpha1
kind: BootstrapConfig
metadata:
  name: default-contour
  namespace: netic-gitops-system
spec:
  sizes:
    small:
      limitRange:
        limits:
          - type: Container
            default:
              cpu: "50m"
              memory: 64Mi
            defaultRequest:
              cpu: "50m"
              memory: 64Mi
      resourceQuota:
        hard:
          requests.cpu: "500m"
          requests.memory: "1Gi"
          requests.storage: "250Gi"
          limits.cpu: "500m"
          limits.memory: "1Gi"
          persistentvolumeclaims: "5"
          count/deployments.apps: "10"

    medium:
      limitRange:
        limits:
          - type: Container
            default:
              cpu: "100m"
              memory: 128Mi
            defaultRequest:
              cpu: "100m"
              memory: 128Mi
      resourceQuota:
        hard:
          requests.cpu: "1"
          requests.memory: "4Gi"
          requests.storage: "500Gi"
          limits.cpu: "1"
          limits.memory: "4Gi"
          persistentvolumeclaims: "10"
          count/deployments.apps: "80"

    large:
      limitRange:
        limits:
          - type: Container
            default:
              cpu: "200m"
              memory: 256Mi
            defaultRequest:
              cpu: "100m"
              memory: 256Mi
      resourceQuota:
        hard:
          requests.cpu: "2"
          requests.memory: "8Gi"
          requests.storage: "750Gi"
          limits.cpu: "2"
          limits.memory: "8Gi"
          persistentvolumeclaims: "15"
          count/deployments.apps: "160"

    extra-large:
      limitRange:
        limits:
          - type: Container
            default:
              cpu: "400m"
              memory: 384Mi
            defaultRequest:
              cpu: "400m"
              memory: 384Mi
      resourceQuota:
        hard:
          requests.cpu: "4"
          requests.memory: "16Gi"
          requests.storage: "1024Gi"
          limits.cpu: "4"
          limits.memory: "16Gi"
          persistentvolumeclaims: "20"
          count/deployments.apps: "240"

  rules: # Role rules for deployment user
    - apiGroups: [""]
      resources: ["services", "configmaps", "secrets", "persistentvolumeclaims", "serviceaccounts"]
      verbs: ["*"]
    - apiGroups: ["apps"]
      resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
      verbs: ["*"]
    - apiGroups: ["batch"]
      resources: ["cronjobs", "jobs"]
      verbs: ["*"]
    - apiGroups: ["extensions", "networking.k8s.io"]
      resources: ["ingresses"]
      verbs: ["*"]
    - apiGroups: ["monitoring.coreos.com"]
      resources: ["servicemonitors", "podmonitors", "prometheusrules", "probes"]
      verbs: ["*"]
    - apiGroups: ["projectcontour.io"]
      resources: ["httpproxies"]
      verbs: ["*"]
    - apiGroups: ["policy"]
      resources: ["poddisruptionbudgets"]
      verbs: ["*"]
    - apiGroups: ["helm.toolkit.fluxcd.io"]
      resources: ["helmreleases"]
      verbs: ["*"]
    - apiGroups: ["source.toolkit.fluxcd.io"]
      resources: ["helmrepositories", "gitrepositories"]
      verbs: ["*"]
    - apiGroups: ["image.toolkit.fluxcd.io"]
      resources: ["imagepolicies", "imagerepositories", "imageupdateautomations"]
      verbs: ["*"]
    - apiGroups: ["notification.toolkit.fluxcd.io"]
      resources: ["alerts", "providers", "receivers"]
      verbs: ["*"]
    - apiGroups: ["cert-manager.io"]
      resources: ["certificates"]
      verbs: ["*"]
    - apiGroups: ["external-secrets.io"]
      resources: ["externalsecrets"]
      verbs: ["*"]
    - apiGroups: ["autoscaling"]
      resources: ["horizontalpodautoscalers"]
      verbs: ["*"]

  networkPolicies: # Default network policies - deny-all will always be added
    contour-ingress:
      podSelector:
        matchLabels:
          netic.dk/network-ingress: contour
      policyTypes:
        - Ingress
      ingress:
        - from:  # Contour ingress controller
          - namespaceSelector:
              matchLabels:
                name: netic-ingress-system
          ports:
            - protocol: TCP
              port: http
            - protocol: TCP
              port: https
    prometheus-ingress:
      podSelector:
        matchLabels:
          netic.dk/network-ingress: contour
      policyTypes:
        - Ingress
      ingress:
        - from:  # Prometheus instances
          - namespaceSelector: {}
            podSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
          ports:
            - protocol: TCP
              port: metrics
            - protocol: TCP
              port: http
    prometheus-scrape-ingress:
      podSelector:
        matchLabels:
          netic.dk/allow-prometheus-scraping: "true"
      policyTypes:
        - Ingress
      ingress:
        - from:  # Prometheus instances
          - namespaceSelector: {}
            podSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
          ports:
            - protocol: TCP
              port: metrics
            - protocol: TCP
              port: http
    default-egress:
      podSelector: {}
      policyTypes:
        - Egress
      egress:
        - ports:
            - protocol: TCP # DNS
              port: 53
            - protocol: UDP # DNS
              port: 53
            - protocol: TCP # https
              port: 443
            - protocol: TCP # PostgreSQL
              port: 5432
        - to:
            - ipBlock:
                cidr: 169.254.169.254/32 # Azure API


  labels: # Labels to add on namespace resource
    netic.dk/monitoring: customer
    netic.dk/enforce-policies: "true"

  git:
    github:
      template:
        owner: neticdk-k8s
        repo: tenant-template
        adminTeam: oaas-team
      secretRef: tcs-github-auth

  vault:
    server: $VAULT_SERVER
    mount: ${DOLLAR}{cluster_provider}
    auth:
      mount: ${DOLLAR}{cluster_provider}/k8s/${DOLLAR}{cluster_name}
      role: tcs-namespace-operator
      serviceAccountRef: tcs-namespace-operator-controller-manager
    namespaceList: k8s/${DOLLAR}{cluster_name}/netic-gitops-system/tcs-namespaces
    pathPrefix: k8s/${DOLLAR}{cluster_name}/{{ .Namespace }}
    data:
      - name: dockerhub-registry-creds
        path: k8s/${DOLLAR}{cluster_name}/netic-gitops-system/dockerhub-registry-creds

  externalSecretsStore:
    provider:
      vault:
        auth:
          kubernetes:
            mountPath: ${DOLLAR}{cluster_provider}/k8s/${DOLLAR}{cluster_name}
            role: external-secrets
            secretRef:
              name: external-secrets-token
        path: ${DOLLAR}{cluster_provider}
        server: $VAULT_SERVER
        version: v2

  openTelemetryCollector:
    config: |
      receivers:
        otlp:
          protocols:
            grpc:
        jaeger:
          protocols:
            grpc:
            thrift_compact:

      processors:
        batch:
        resource:
          attributes:
          - key: provider
            value: "${DOLLAR}{cluster_provider}"
            action: upsert
          - key: cluster
            value: "${DOLLAR}{cluster_name}"
            action: upsert

      exporters:
        otlphttp:
          endpoint: $OTEL_SERVER
        logging:

      service:
        pipelines:
          traces:
            receivers: [otlp, jaeger]
            processors: [batch,resource]
            exporters: [logging, otlphttp]
