---
apiVersion: source.toolkit.fluxcd.io/v1beta1
kind: GitRepository
metadata:
  name: cluster
  namespace: netic-gitops-system
spec:
  interval: 5m
  url: $REPO
  ref:
    branch: main
  secretRef:
    name: kubernetes-config-git-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta1
kind: Kustomization
metadata:
  name: sync
  namespace: netic-gitops-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: cluster
  path: ./clusters/$PROVIDER/$CLUSTER_NAME/bootstrap
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta1
kind: Kustomization
metadata:
  name: common
  namespace: netic-gitops-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: cluster
  path: ./common
  prune: true
  postBuild:
    substitute:
      cluster_operator: $OPERATOR
      cluster_provider: $PROVIDER
      cluster_fqdn: $CLUSTER_NAME.$PROVIDER.$CLUSTER_TYPE.k8s.netic.dk
      cluster_type: $CLUSTER_TYPE
      cluster_env: $CLUSTER_ENV
      cluster_name: $CLUSTER_NAME
      cluster_resilience_zone: $INFRA_BOOTSTRAP_RESILIENCE_ZONE
      region: $REGION
      vault_server: $VAULT_SERVER
      cortex_tenant: netic-external
