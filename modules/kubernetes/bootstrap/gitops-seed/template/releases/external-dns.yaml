---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: external-dns
  namespace: netic-ingress-system
spec:
  interval: 1h0m0s
  timeout: 60s
  url: https://kubernetes-sigs.github.io/external-dns/
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: external-dns
  namespace: netic-ingress-system
spec:
  chart:
    spec:
      chart: external-dns
      version: "1.10.1"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: netic-ingress-system
      interval: 5m

  interval: 5m

  values:
    resources:
      limits:
        cpu: "250m"
        memory: 512M
      requests:
        cpu: 50m
        memory: 64Mi
    interval: 2m
    sources:
      - service
      - ingress
      - $INGRESS_SOURCE
    txtOwnerId: $DNS.$REGION
    txtPrefix: extdns.
    domainFilters: []
    provider: azure
    policy: sync
    logLevel: info

    extraVolumes:
      - name: azure-config
        secret:
          secretName: external-dns-azure
    extraVolumeMounts:
      - name: azure-config
        mountPath: /etc/kubernetes
        readOnly: true
