apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: support@netic.dk
    privateKeySecretRef:
      name: letsencrypt-production
    solvers:
      - dns01:
          azureDNS:
            subscriptionID: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx #Azure Subscription ID
            resourceGroupName: xxxx-rg-xxxxx-dev-001 #Resource group name
            hostedZoneName: example.azure.netic.dk # DNS Zone created in Azure
            environment: AzurePublicCloud